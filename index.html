  <style>
    :root { --border:#e5e7eb; --muted:#6b7280; --accent:#2563eb; }
    * { box-sizing:border-box; }
    html,body { height:100%; margin:0; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; color:#111827; }
    body { display:flex; overflow:hidden; background:#f8fafc; }
    #sidebar { width:390px; min-width:300px; height:100%; background:#fff; border-right:1px solid var(--border); display:flex; flex-direction:column; z-index:2; }
    header { padding:16px 16px 12px; border-bottom:1px solid var(--border); }
    h1 { font-size:18px; margin:0 0 5px; }
    .summary { color:var(--muted); font-size:12px; line-height:1.5; }
    .legend { display:flex; flex-wrap:wrap; gap:8px 12px; margin-top:8px; font-size:12px; }
    .legend-item { display:inline-flex; align-items:center; gap:5px; color:#374151; }
    .legend-swatch { width:11px; height:11px; border-radius:50%; display:inline-block; border:1px solid rgba(0,0,0,.15); }
    .controls { display:flex; gap:8px; margin-top:12px; }
    input,button { font:inherit; }
    input { flex:1; min-width:0; border:1px solid #d1d5db; border-radius:8px; padding:8px 10px; outline:none; }
    input:focus { border-color:var(--accent); box-shadow:0 0 0 2px #bfdbfe; }
    button { border:1px solid #d1d5db; background:#fff; border-radius:8px; padding:7px 10px; cursor:pointer; }
    button:hover { background:#f3f4f6; }
    #list { overflow:auto; padding:8px; }
    .card { display:grid; grid-template-columns:88px 1fr; gap:10px; padding:9px; margin-bottom:7px; border:1px solid var(--border); border-radius:10px; cursor:pointer; background:#fff; }
    .card:hover, .card.active { border-color:#93c5fd; background:#eff6ff; }
    .thumb { width:88px; height:66px; border-radius:6px; object-fit:cover; background:#e5e7eb; }
    .name { font-size:14px; font-weight:650; line-height:1.35; margin-bottom:4px; }
    .original { color:var(--muted); font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .meta { color:var(--muted); font-size:11px; margin-top:5px; }
    .links { margin-top:6px; display:flex; gap:8px; font-size:12px; }
    a { color:var(--accent); text-decoration:none; }
    a:hover { text-decoration:underline; }
    #map { flex:1; height:100%; min-width:0; }
    .popup { width:230px; }
    .popup img { width:230px; max-height:150px; object-fit:cover; border-radius:6px; margin:5px 0 7px; }
    .popup-title { font-weight:700; line-height:1.35; }
    .popup-meta { color:var(--muted); font-size:11px; margin:3px 0 6px; }
    .popup-links { display:flex; gap:10px; font-size:12px; }
    .empty { color:var(--muted); padding:20px 10px; text-align:center; font-size:13px; }
    @media (max-width:760px) {
      body { display:block; overflow:auto; }
      #sidebar { width:100%; height:46vh; min-height:260px; border-right:0; border-bottom:1px solid var(--border); }
      #map { height:54vh; min-height:340px; }
    }
  </style>

"name":"おみやげ処金沢店","image":"https://image.anitabi.cn/user/0/bangumi/240038/points/1j4zecu-1750344368986.jpg?plan=h160","ep":13,"s":1169,"geo":[36.5785,136.6483],"origin":"Anitabi","originURL":"https://anitabi.cn/","workId":"240038"},{"id":"3tyv0sb","name":"Morgen Kaffee","image":"https://image.anitabi.cn/user/2187/bangumi/240038/points/3tyv0sb-1755352787954.jpg?plan=h160","ep":10,"s":593,"geo":[35.3391,139.4892],"origin":"Anitabi@舞影一诺","originURL":"https://anitabi.cn/","workId":"240038"},{"id":"4zhlohs","name":"ステラタウン","image":"https://image.anitabi.cn/user/2187/bangumi/240038/points/4zhlohs-1757863406946.jpg?plan=h160","ep":9,"s":919,"geo":[35.9326,139.6218],"origin":"Anitabi@舞影一诺","originURL":"https://anitabi.cn/","workId":"240038"},{"id":"2pzqg9c","cn":"聂耳纪念广场","name":"囁耳記念広場","image":"https://image.anitabi.cn/user/2187/bangumi/240038/points/2pzqg9c-1752935591812.jpg?plan=h160","geo":[35.3171,139.4677],"origin":"Anitabi@舞影一诺","originURL":"https://anitabi.cn/","workId":"240038"},{"id":"2pzs6qp","name":"鎌倉高校前駅","image":"https://image.anitabi.cn/user/2187/bangumi/240038/points/2pzs6qp-1752935672859.jpg?plan=h160","geo":[35.3067,139.5005],"origin":"Anitabi@舞影一诺","originURL":"https://anitabi.cn/","workId":"240038"}];
    const workStyles = {
      '428735': { label:'作品 428735', color:'#2563eb' },
      '160209': { label:'作品 160209', color:'#f97316' },
      '40310-72266-208826-191302-208825-208827': { label:'合并作品 40310 / 72266 / 208826 / 191302 / 208825 / 208827', color:'#16a34a' },
      '240038': { label:'作品 240038', color:'#9333ea' }
    };
    const map = L.map('map', { preferCanvas:true });
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom:19,
      attribution:'&copy; OpenStreetMap contributors'
    }).addTo(map);

    const clusters = new Map();
    Object.entries(workStyles).forEach(([workId, style]) => {
      clusters.set(workId, L.markerClusterGroup({
        showCoverageOnHover:false,
        maxClusterRadius:42,
        iconCreateFunction: group => L.divIcon({
          className:'work-cluster',
          html:'<span style="display:block;background:' + style.color + ';color:white;border:3px solid white;border-radius:50%;width:40px;height:40px;text-align:center;line-height:34px;font-size:13px;font-weight:700;box-shadow:0 1px 5px #555">' + group.getChildCount() + '</span>',
          iconSize:[40,40], iconAnchor:[20,20]
        })
      }));
    });
    const markers = [];
    const markerById = new Map();
    const cardById = new Map();

    function displayName(p) { return p.cn || p.name || '未命名地点'; }
    function fullImage(url) { return url.replace('?plan=h160', '?plan=h360'); }
    function mapsUrl(p) {
      return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(p.geo[0] + ',' + p.geo[1]);
    }
    function timeText(seconds) {
      if (seconds === undefined || seconds === null || seconds === '') return '';
      const n = Number(seconds);
      if (!Number.isFinite(n)) return String(seconds);
      const h = Math.floor(n / 3600), m = Math.floor((n % 3600) / 60), s = n % 60;
      return (h ? h + ':' + String(m).padStart(2,'0') : String(m)) + ':' + String(s).padStart(2,'0');
    }
    function popupHtml(p) {
      const title = displayName(p);
      const original = p.cn && p.name && p.cn !== p.name ? '<div class="popup-meta">' + p.name + '</div>' : '';
      const meta = [p.ep ? '第 ' + p.ep + ' 集' : '', timeText(p.s) ? '时间 ' + timeText(p.s) : ''].filter(Boolean).join(' · ');
      return '<div class="popup">' +
        '<div class="popup-title">' + title + '</div>' + original +
        '<img src="' + p.image + '" loading="lazy" alt="' + title + '">' +
        '<div class="popup-meta">坐标：' + p.geo[0] + ', ' + p.geo[1] + (meta ? ' · ' + meta : '') + '</div>' +
        '<div class="popup-links"><a href="' + p.image + '" target="_blank">查看图片</a><a href="' + fullImage(p.image) + '" target="_blank">高清图片</a><a href="' + mapsUrl(p) + '" target="_blank">Google Maps</a></div>' +
        '</div>';
    }
    function selectPoint(id) {
      const p = points.find(x => x.id === id);
      const marker = markerById.get(id);
      if (!p || !marker) return;
      document.querySelectorAll('.card.active').forEach(x => x.classList.remove('active'));
      const card = cardById.get(id);
      if (card) { card.classList.add('active'); card.scrollIntoView({ behavior:'smooth', block:'nearest' }); }
      map.setView([p.geo[0], p.geo[1]], Math.max(map.getZoom(), 16));
      const group = clusters.get(p.workId);
      if (group) group.zoomToShowLayer(marker, () => marker.openPopup());
      else marker.openPopup();
    }
    function renderList() {
      const query = document.getElementById('search').value.trim().toLowerCase();
      const list = document.getElementById('list');
      list.innerHTML = '';
      cardById.clear();
      const filtered = points.filter(p => (displayName(p) + ' ' + (p.name || '')).toLowerCase().includes(query));
      document.getElementById('summary').textContent = '共 ' + points.length + ' 个地点 · 当前显示 ' + filtered.length + ' 个。缩小时圆框数字表示该作品在此区域的地点数量。';
      if (!filtered.length) { list.innerHTML = '<div class="empty">没有找到匹配地点</div>'; return; }
      filtered.forEach(p => {
        const card = document.createElement('article');
        card.className = 'card';
        card.innerHTML = '<img class="thumb" src="' + p.image + '" loading="lazy" alt="' + displayName(p) + '">' +
          '<div><div class="name"><span class="legend-swatch" style="background:' + (workStyles[p.workId] || {color:'#6b7280'}).color + '"></span> ' + displayName(p) + '</div>' +
          (p.cn && p.name && p.cn !== p.name ? '<div class="original">' + p.name + '</div>' : '') +
          '<div class="meta">' + p.geo[0] + ', ' + p.geo[1] + (p.ep ? ' · 第 ' + p.ep + ' 集' : '') + '</div>' +
          '<div class="links"><a href="' + mapsUrl(p) + '" target="_blank" onclick="event.stopPropagation()">Google Maps</a><a href="' + fullImage(p.image) + '" target="_blank" onclick="event.stopPropagation()">高清图片</a></div></div>';
        card.addEventListener('click', () => selectPoint(p.id));
        list.appendChild(card);
        cardById.set(p.id, card);
      });
    }

    points.forEach((p) => {
      const style = workStyles[p.workId] || { color:'#6b7280' };
      const marker = L.marker([p.geo[0], p.geo[1]], {
        title: displayName(p),
        icon: L.divIcon({ className:'location-marker', html:'<span style="display:block;background:' + style.color + ';border:2px solid white;border-radius:50%;width:16px;height:16px;box-shadow:0 1px 4px #555"></span>', iconSize:[16,16], iconAnchor:[8,8] })
      });
      marker.bindPopup(popupHtml(p));
      marker.on('click', () => {
        document.querySelectorAll('.card.active').forEach(x => x.classList.remove('active'));
        const card = cardById.get(p.id);
        if (card) { card.classList.add('active'); card.scrollIntoView({ behavior:'smooth', block:'nearest' }); }
      });
      markerById.set(p.id, marker);
      markers.push(marker);
      const group = clusters.get(p.workId) || clusters.get('428735');
      group.addLayer(marker);
    });
    clusters.forEach(group => map.addLayer(group));
    document.getElementById('legend').innerHTML = Object.entries(workStyles).map(([id, style]) => '<span class="legend-item"><span class="legend-swatch" style="background:' + style.color + '"></span>' + style.label + '</span>').join('');
    const bounds = L.latLngBounds(points.map(p => [p.geo[0], p.geo[1]]));
    map.fitBounds(bounds, { padding:[30,30] });
    document.getElementById('fit').addEventListener('click', () => map.fitBounds(bounds, { padding:[30,30] }));
    document.getElementById('search').addEventListener('input', renderList);
    renderList();
  </script>
